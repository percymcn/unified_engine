# =============================================================================
# TRADEFLOW PRODUCTION DOCKER COMPOSE
# =============================================================================
# Production-ready Docker Compose configuration
# Uses: PostgreSQL, Redis, Next.js, FastAPI with security hardening

version: '3.8'

services:
  # =============================================================================
  # BACKEND SERVICE - FASTAPI
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8000"
    environment:
      - DATABASE_URL=postgresql://tradeflow:${POSTGRES_PASSWORD}@postgres:5432/tradeflow_prod?sslmode=require
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NEXT_PUBLIC_FRONTEND_URL=https://tradeflow.fluxeo.net
      - NEXT_PUBLIC_BACKEND_URL=https://api.tradeflow.fluxeo.net
      - NEXT_PUBLIC_WEBHOOK_BASE_URL=https://api.tradeflow.fluxeo.net
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://tradeflow.fluxeo.net/api/auth/google/callback
      - LOG_LEVEL=error
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # POSTGRESQL DATABASE
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tradeflow_prod
      POSTGRES_USER: tradeflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # REDIS CACHE
  # =============================================================================
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # FRONTEND SERVICE - NEXT.JS
  # =============================================================================
  frontend:
    build:
      context: ui-next
      dockerfile: Dockerfile
    ports:
      - "3456:3000"
    environment:
      - NEXT_PUBLIC_FRONTEND_URL=https://tradeflow.fluxeo.net
      - NEXT_PUBLIC_BACKEND_URL=https://api.tradeflow.fluxeo.net
      - NEXT_PUBLIC_WEBHOOK_BASE_URL=https://api.tradeflow.fluxeo.net
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3456/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# =============================================================================
  # PERSISTENT VOLUMES
# =============================================================================
volumes:
  postgres_data:
  redis_data: