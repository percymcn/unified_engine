<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFlow Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0f1419;
            color: #e4e6eb;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #fff;
        }

        .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
        }

        /* Status Card */
        .status-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .status-dot.active {
            background: #3fb950;
            box-shadow: 0 0 10px #3fb950;
        }

        .status-dot.inactive {
            background: #6e7681;
        }

        .toggle-switch {
            position: relative;
            width: 60px;
            height: 30px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #30363d;
            transition: .4s;
            border-radius: 30px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #3fb950;
        }

        input:checked + .slider:before {
            transform: translateX(30px);
        }

        /* Sentiment Scores Grid */
        .scores-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .score-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
        }

        .score-card.bullish {
            border-left: 4px solid #3fb950;
        }

        .score-card.bearish {
            border-left: 4px solid #da3633;
        }

        .score-card.neutral {
            border-left: 4px solid #8b949e;
        }

        .score-ticker {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .score-value.positive {
            color: #3fb950;
        }

        .score-value.negative {
            color: #da3633;
        }

        .score-value.neutral {
            color: #8b949e;
        }

        .score-details {
            display: flex;
            gap: 20px;
            color: #8b949e;
            font-size: 14px;
        }

        /* Signal Log */
        .signal-log {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
        }

        .signal-log h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .signal-table {
            width: 100%;
            border-collapse: collapse;
        }

        .signal-table th {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #30363d;
            color: #8b949e;
            font-weight: 600;
            font-size: 14px;
        }

        .signal-table td {
            padding: 12px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        .signal-table tr:hover {
            background: #0d1117;
        }

        .signal-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .signal-badge.buy {
            background: rgba(63, 185, 80, 0.1);
            color: #3fb950;
        }

        .signal-badge.sell {
            background: rgba(218, 54, 51, 0.1);
            color: #da3633;
        }

        .signal-badge.close {
            background: rgba(139, 148, 158, 0.1);
            color: #8b949e;
        }

        /* Config Panel */
        .config-panel {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            margin-top: 20px;
        }

        .config-panel h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e4e6eb;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e4e6eb;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #238636;
            color: white;
        }

        .btn-primary:hover {
            background: #2ea043;
        }

        .btn-secondary {
            background: #21262d;
            color: #e4e6eb;
            border: 1px solid #30363d;
        }

        .btn-secondary:hover {
            background: #30363d;
        }

        .timestamp {
            color: #8b949e;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .error {
            background: rgba(218, 54, 51, 0.1);
            border: 1px solid #da3633;
            color: #da3633;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 SmartFlow Indicator</h1>
        <p class="subtitle">AI-powered signals from institutional options flow</p>

        <!-- Status Card -->
        <div class="status-card">
            <div class="status-header">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Loading...</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="enableToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="score-details">
                <div>Last Update: <span id="lastUpdate">--</span></div>
                <div>Webhook URLs: <span id="webhookCount">0</span></div>
                <div>Update Interval: <span id="updateInterval">--</span>s</div>
            </div>
        </div>

        <!-- Sentiment Scores -->
        <div class="scores-grid" id="scoresGrid">
            <div class="loading">Loading sentiment scores...</div>
        </div>

        <!-- Recent Signals -->
        <div class="signal-log">
            <h2>📊 Recent Signals</h2>
            <table class="signal-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Ticker</th>
                        <th>Action</th>
                        <th>Score</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tbody id="signalTableBody">
                    <tr><td colspan="5" class="loading">No signals yet</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Configuration (collapsed by default) -->
        <details class="config-panel">
            <summary style="cursor: pointer; font-size: 18px; font-weight: 600; margin-bottom: 16px;">⚙️ Configuration</summary>
            <div class="form-group">
                <label>Webhook URLs (comma-separated)</label>
                <input type="text" id="webhookUrls" placeholder="https://api.mytradeflow.app/webhooks/...">
            </div>
            <div class="form-group">
                <label>Buy Threshold (score > value triggers buy)</label>
                <input type="number" id="buyThreshold" value="4.0" step="0.5">
            </div>
            <div class="form-group">
                <label>Sell Threshold (score < value triggers sell)</label>
                <input type="number" id="sellThreshold" value="-4.0" step="0.5">
            </div>
            <button class="btn btn-primary" onclick="saveConfig()">Save Configuration</button>
        </details>
    </div>

    <script>
        // Replace with your API endpoint
        const API_BASE = '/api/v1/smartflow';
        const AUTH_TOKEN = localStorage.getItem('auth_token'); // Or however you store auth

        // Fetch status and update UI
        async function fetchStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`, {
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    }
                });

                if (!response.ok) throw new Error('Failed to fetch status');

                const data = await response.json();
                updateStatusUI(data);
            } catch (error) {
                console.error('Error fetching status:', error);
            }
        }

        // Update UI with status data
        function updateStatusUI(data) {
            // Status indicator
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const enableToggle = document.getElementById('enableToggle');

            if (data.enabled) {
                statusDot.className = 'status-dot active';
                statusText.textContent = 'SmartFlow Active';
                enableToggle.checked = true;
            } else {
                statusDot.className = 'status-dot inactive';
                statusText.textContent = 'SmartFlow Disabled';
                enableToggle.checked = false;
            }

            // Details
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            document.getElementById('webhookCount').textContent = data.webhook_count;
            document.getElementById('updateInterval').textContent = data.update_interval;

            // Sentiment scores
            const scoresGrid = document.getElementById('scoresGrid');
            scoresGrid.innerHTML = '';

            for (const [ticker, score] of Object.entries(data.latest_scores)) {
                const scoreCard = createScoreCard(ticker, score);
                scoresGrid.appendChild(scoreCard);
            }

            // Recent signals
            const signalTableBody = document.getElementById('signalTableBody');
            signalTableBody.innerHTML = '';

            if (data.recent_signals.length === 0) {
                signalTableBody.innerHTML = '<tr><td colspan="5" class="loading">No signals yet</td></tr>';
            } else {
                data.recent_signals.slice().reverse().forEach(signal => {
                    const row = createSignalRow(signal);
                    signalTableBody.appendChild(row);
                });
            }
        }

        // Create score card element
        function createScoreCard(ticker, scoreData) {
            const card = document.createElement('div');
            const score = scoreData.score;

            let cardClass = 'score-card';
            let scoreClass = 'score-value';

            if (score > 4) {
                cardClass += ' bullish';
                scoreClass += ' positive';
            } else if (score < -4) {
                cardClass += ' bearish';
                scoreClass += ' negative';
            } else {
                cardClass += ' neutral';
                scoreClass += ' neutral';
            }

            card.className = cardClass;
            card.innerHTML = `
                <div class="score-ticker">${ticker}</div>
                <div class="${scoreClass}">${score.toFixed(1)}</div>
                <div class="score-details">
                    <div>🟢 ${scoreData.bullish_flows}</div>
                    <div>🔴 ${scoreData.bearish_flows}</div>
                    <div>💵 $${(scoreData.total_premium / 1000).toFixed(0)}K</div>
                </div>
                <div class="timestamp">${new Date(scoreData.timestamp).toLocaleTimeString()}</div>
            `;

            return card;
        }

        // Create signal row element
        function createSignalRow(signal) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="timestamp">${new Date(signal.timestamp).toLocaleString()}</td>
                <td>${signal.ticker}</td>
                <td><span class="signal-badge ${signal.action}">${signal.action}</span></td>
                <td>${signal.score.toFixed(1)}</td>
                <td>Market</td>
            `;
            return row;
        }

        // Toggle SmartFlow enable/disable
        document.getElementById('enableToggle').addEventListener('change', async (e) => {
            const enabled = e.target.checked;

            try {
                // First fetch current config
                const configResponse = await fetch(`${API_BASE}/config`, {
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });
                const config = await configResponse.json();

                // Update enabled status
                const response = await fetch(`${API_BASE}/config`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ...config,
                        enabled: enabled
                    })
                });

                if (response.ok) {
                    fetchStatus(); // Refresh status
                } else {
                    throw new Error('Failed to update config');
                }
            } catch (error) {
                console.error('Error toggling SmartFlow:', error);
                e.target.checked = !enabled; // Revert toggle
            }
        });

        // Save configuration
        async function saveConfig() {
            const webhookUrls = document.getElementById('webhookUrls').value
                .split(',')
                .map(url => url.trim())
                .filter(url => url.length > 0);

            const buyThreshold = parseFloat(document.getElementById('buyThreshold').value);
            const sellThreshold = parseFloat(document.getElementById('sellThreshold').value);

            try {
                const response = await fetch(`${API_BASE}/config`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        enabled: document.getElementById('enableToggle').checked,
                        webhook_urls: webhookUrls,
                        buy_threshold: buyThreshold,
                        sell_threshold: sellThreshold
                    })
                });

                if (response.ok) {
                    alert('Configuration saved successfully!');
                    fetchStatus();
                } else {
                    throw new Error('Failed to save config');
                }
            } catch (error) {
                console.error('Error saving config:', error);
                alert('Failed to save configuration');
            }
        }

        // Load initial config
        async function loadConfig() {
            try {
                const response = await fetch(`${API_BASE}/config`, {
                    headers: { 'Authorization': `Bearer ${AUTH_TOKEN}` }
                });

                const config = await response.json();

                document.getElementById('webhookUrls').value = config.webhook_urls.join(', ');
                document.getElementById('buyThreshold').value = config.buy_threshold;
                document.getElementById('sellThreshold').value = config.sell_threshold;
            } catch (error) {
                console.error('Error loading config:', error);
            }
        }

        // Initialize
        fetchStatus();
        loadConfig();

        // Auto-refresh every 10 seconds
        setInterval(fetchStatus, 10000);
    </script>
</body>
</html>
