version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - unified_postgres_data:/var/lib/postgresql/data
    networks:
      - unified-network
    secrets:
      - db_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - unified_redis_data:/data
    networks:
      - unified-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # NATS Message Bus
  nats:
    image: nats:2.10-alpine
    command:
      - "--cluster_name=trading"
      - "--http_port=8223"
    ports:
      - "4223:4222"  # Client connections (external:internal)
      - "8223:8223"  # HTTP monitoring
    networks:
      - unified-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Main FastAPI Application
  api:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - target: 8000
        published: 3012
        protocol: tcp
        mode: ingress

  # Celery Worker
  celery-worker:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Celery Beat Scheduler
  celery-beat:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Flower (Celery Monitoring)
  flower:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: sh -c 'celery -A app.tasks.celery_app flower --port=5555 --basic_auth=$$(cat /run/secrets/flower_auth)'
    ports:
      - "5558:5555"
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
      - flower_auth
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Next.js UI
  ui:
    image: 192.168.1.254:5000/unified-engine/ui-next:latest
    build:
      context: ./ui-next
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
      - BACKEND_URL=http://api:8000
    ports:
      - "3411:3000"
    networks:
      - unified-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Funnel Automation Service
  funnel-automation:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: python -c "import asyncio; from app.services.funnel_automation import main; asyncio.run(main())"
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "3013:80"
    configs:
      - source: unified_nginx_conf
        target: /etc/nginx/nginx.conf
    networks:
      - unified-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  unified-network:
    driver: overlay
    attachable: true

configs:
  unified_nginx_conf:
    name: unified_nginx_conf_v2
    external: true

volumes:
  unified_postgres_data:
  unified_redis_data:

secrets:
  db_password:
    external: true
  secret_key:
    external: true
  jwt_secret:
    external: true
  credential_encryption_key:
    external: true
  flower_auth:
    external: true