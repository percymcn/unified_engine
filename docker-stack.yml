version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - unified_postgres_data:/var/lib/postgresql/data
    networks:
      - unified-network
    secrets:
      - db_password
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - unified_redis_data:/data
    networks:
      - unified-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NATS Message Bus
  nats:
    image: nats:2.10-alpine
    command:
      - "--cluster_name=trading"
      - "--http_port=8223"
    ports:
      - "4223:4222"  # Client connections (external:internal)
      - "8223:8223"  # HTTP monitoring
    networks:
      - unified-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8223/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main FastAPI Application
  api:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    environment:
      # Core Settings
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - ENVIRONMENT=production
      - FRONTEND_URL=https://mytradeflow.app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Google OAuth (ID is public, secret loaded from Docker secret)
      - GOOGLE_CLIENT_ID=245547382264-erko44adkasedj547c4r0jkk4b7gt0mm.apps.googleusercontent.com
      - GOOGLE_REDIRECT_URI=https://mytradeflow.app/api/auth/google/callback
      # MetaAPI (token loaded from Docker secret)
      - METAAPI_APPLICATION=tradeflow
      # Stripe Keys (publishable is public, secret loaded from Docker secret)
      - STRIPE_PUBLISHABLE_KEY=pk_live_51Sj3b9AeDMJzniTXZXoZkFzqOM5sJsJcQgFiXzxVKWNTATsFLD7ApOQJSVmNWxGihzpQ5A5g038YzYj9rqoIn3fd000ayzdBBU
      # Stripe Price IDs (Monthly) - these are public
      - STRIPE_PRICE_TIER1_MONTHLY=price_1SuGD8AeDMJzniTXYXFcjNUn
      - STRIPE_PRICE_TIER2_MONTHLY=price_1SuGVuAeDMJzniTXmuM6UM23
      - STRIPE_PRICE_TIER3_MONTHLY=price_1SuGXsAeDMJzniTXKVp7x94O
      - STRIPE_PRICE_TIER4_MONTHLY=price_1SuGYXAeDMJzniTXQiBisbhc
      # Stripe Price IDs (Annual) - these are public
      - STRIPE_PRICE_TIER1_ANNUAL=price_1SungBAeDMJzniTX013x3GMl
      - STRIPE_PRICE_TIER2_ANNUAL=price_1SunfTAeDMJzniTXGXGxG08B
      - STRIPE_PRICE_TIER3_ANNUAL=price_1SunenAeDMJzniTXFiIyg9mF
      - STRIPE_PRICE_TIER4_ANNUAL=price_1Sune6AeDMJzniTX9TJglICS
      # Admin
      - OWNER_ADMIN_EMAILS=benzemm110@gmail.com
      # CORS
      - CORS_ORIGINS=["https://mytradeflow.app", "https://www.mytradeflow.app", "https://api.mytradeflow.app", "http://localhost:3456"]
      # JWT - reduced from 24h to 1h for security
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      # ProjectX/TopstepX
      - PROJECTX_API_URL=https://api.topstepx.com
      - TOPSTEPX_API_URL=https://api.topstepx.com
      - TOPSTEPX_USER_HUB=https://rtc.topstepx.com/hubs/user
      - TOPSTEPX_MARKET_HUB=https://rtc.topstepx.com/hubs/market
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
      - google_client_secret
      - metaapi_token
      - stripe_secret_key
      - stripe_webhook_secret
      - anthropic_api_key
      - resend_api_key
    deploy:
      replicas: 1
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    ports:
      - target: 8000
        published: 8765
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery Worker
  celery-worker:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - METAAPI_APPLICATION=tradeflow
      - PROJECTX_API_URL=https://api.topstepx.com
      - TOPSTEPX_API_URL=https://api.topstepx.com
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
      - metaapi_token
      - stripe_secret_key
      - anthropic_api_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Celery Beat Scheduler
  celery-beat:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid"]
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 10
        window: 120s
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Flower (Celery Monitoring)
  flower:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: ["sh", "-c", "celery -A app.tasks.celery_app flower --port=5555 --basic_auth=$$(cat /run/secrets/flower_auth)"]
    ports:
      - "5558:5555"
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
      - flower_auth
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Next.js UI
  ui:
    image: 192.168.1.254:5000/unified-engine/ui:latest
    build:
      context: ./ui-next
      dockerfile: Dockerfile
    environment:
      - BACKEND_URL=http://api:8000
      - NEXT_PUBLIC_BACKEND_URL=https://api.mytradeflow.app
    ports:
      - "3456:3456"
    networks:
      - unified-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 5s

  # Funnel Automation Service
  funnel-automation:
    image: 192.168.1.254:5000/unified-engine/api:latest
    build:
      context: .
      dockerfile: Dockerfile.stack
    command: ["python", "-c", "import asyncio; from app.services.funnel_automation import main; asyncio.run(main())"]
    environment:
      - DATABASE_URL=postgresql://trading_user@postgres:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - unified-network
    secrets:
      - db_password
      - secret_key
      - jwt_secret
      - credential_encryption_key
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "3013:80"
    configs:
      - source: unified_nginx_conf
        target: /etc/nginx/nginx.conf
    networks:
      - unified-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  unified-network:
    driver: overlay
    attachable: true

configs:
  unified_nginx_conf:
    name: unified_nginx_conf_v2
    external: true

volumes:
  unified_postgres_data:
    driver: local
  unified_redis_data:
    driver: local

secrets:
  db_password:
    external: true
  secret_key:
    external: true
  jwt_secret:
    external: true
  credential_encryption_key:
    external: true
    name: credential_encryption_key_v11
  flower_auth:
    external: true
  google_client_secret:
    external: true
  metaapi_token:
    external: true
  stripe_secret_key:
    external: true
  stripe_webhook_secret:
    external: true
  anthropic_api_key:
    external: true
  resend_api_key:
    external: true